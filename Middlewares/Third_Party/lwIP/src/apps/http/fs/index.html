<!DOCTYPE html>
<html>
<head>
    <title>STM32F411 Telemetry</title>
    <meta charset="utf-8">
    <style>
        body { 
            font-family: Arial, sans-serif; 
            text-align: center; 
            margin-top: 50px; 
            background-color: #f4f4f9; 
        }
        h2 { color: #333; }
        .card { 
            background: white; 
            padding: 25px; 
            border-radius: 8px; 
            display: inline-block; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.1); 
        }
        .val { 
            font-size: 28px; 
            color: #007BFF; 
            font-weight: bold; 
        }
    </style>
    <script>
        function updateTelemetry() {
            fetch('/api/data')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('temp').innerText = data.temp.toFixed(1);
                    document.getElementById('humid').innerText = data.humid.toFixed(1);
                })
                .catch(err => console.log('AJAX fetch error:', err));
        }

        // Poll every 2 seconds in the background without reloading the page
        setInterval(updateTelemetry, 2000);
    </script>
</head>
<body>
    <div class="card">
        <h2>STM32F411 Live Telemetry</h2>
        <hr style="border:0; border-top:1px solid #ddd; margin:15px 0;">
        <p>Temperature: <span id="temp" class="val">--.-</span> &deg;C</p>
        <p>Humidity: <span id="humid" class="val">--.-</span> %%</p>
        <p style="color: gray; font-size: 11px; margin-top: 20px;">Async AJAX Active (No Page Reload)</p>
    </div>
</body>
</html>
